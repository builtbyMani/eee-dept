<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="currentColor">
  <!-- Grid Matrix -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- Chassis Body -->
  <path d="M260 280 H540 L510 370 H290 Z" stroke="#c4c4c4" stroke-width="2.5" fill="rgba(255, 255, 255, 0.02)"/>
  <rect x="300" y="240" width="200" height="40" stroke="#c4c4c4" stroke-width="2"/>
  
  <!-- Mast & Stereoscopic Sensor Head -->
  <line x1="340" y1="240" x2="340" y2="150" stroke="#c4c4c4" stroke-width="2.5"/>
  <line x1="330" y1="150" x2="390" y2="150" stroke="#c4c4c4" stroke-width="3"/>
  <circle cx="345" cy="140" r="10" stroke="#00e5ff" stroke-width="2" fill="rgba(0, 229, 255, 0.1)"/>
  <circle cx="375" cy="140" r="10" stroke="#00e5ff" stroke-width="2" fill="rgba(0, 229, 255, 0.1)"/>
  <line x1="360" y1="130" x2="360" y2="110" stroke="#c4c4c4" stroke-width="2"/>
  <circle cx="360" cy="105" r="5" stroke="#f5a623" stroke-width="2"/>

  <!-- High-Gain Antenna -->
  <path d="M480 240 L510 170" stroke="#c4c4c4" stroke-width="2"/>
  <ellipse cx="525" cy="155" rx="28" ry="14" transform="rotate(-30 525 155)" stroke="#c4c4c4" stroke-width="2" fill="rgba(255, 255, 255, 0.03)"/>

  <!-- Rocker-Bogie Suspension Linkage -->
  <!-- Left Side -->
  <line x1="300" y1="330" x2="200" y2="390" stroke="#c4c4c4" stroke-width="3"/>
  <line x1="200" y1="390" x2="150" y2="440" stroke="#c4c4c4" stroke-width="3"/>
  <line x1="200" y1="390" x2="270" y2="440" stroke="#c4c4c4" stroke-width="3"/>

  <!-- Right Side -->
  <line x1="500" y1="330" x2="600" y2="390" stroke="#c4c4c4" stroke-width="3"/>
  <line x1="600" y1="390" x2="530" y2="440" stroke="#c4c4c4" stroke-width="3"/>
  <line x1="600" y1="390" x2="650" y2="440" stroke="#c4c4c4" stroke-width="3"/>

  <!-- Center Differential Link -->
  <path d="M300 330 Q400 310 500 330" stroke="#f5a623" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Six Wheels with Deep Cleats/Treads -->
  <!-- Front Left -->
  <circle cx="150" cy="460" r="32" stroke="#c4c4c4" stroke-width="3" fill="#090909"/>
  <circle cx="150" cy="460" r="16" stroke="#c4c4c4" stroke-width="2"/>
  <path d="M125 460 H175 M150 435 V485" stroke="#c4c4c4" stroke-width="1.5"/>

  <!-- Middle Left -->
  <circle cx="270" cy="460" r="32" stroke="#c4c4c4" stroke-width="3" fill="#090909"/>
  <circle cx="270" cy="460" r="16" stroke="#c4c4c4" stroke-width="2"/>
  <path d="M245 460 H295 M270 435 V485" stroke="#c4c4c4" stroke-width="1.5"/>

  <!-- Rear Left -->
  <circle cx="390" cy="465" r="30" stroke="#808080" stroke-width="2.5" fill="#090909"/>
  
  <!-- Rear Right -->
  <circle cx="490" cy="465" r="30" stroke="#808080" stroke-width="2.5" fill="#090909"/>

  <!-- Middle Right -->
  <circle cx="530" cy="460" r="32" stroke="#c4c4c4" stroke-width="3" fill="#090909"/>
  <circle cx="530" cy="460" r="16" stroke="#c4c4c4" stroke-width="2"/>
  <path d="M505 460 H555 M530 435 V485" stroke="#c4c4c4" stroke-width="1.5"/>

  <!-- Front Right -->
  <circle cx="650" cy="460" r="32" stroke="#c4c4c4" stroke-width="3" fill="#090909"/>
  <circle cx="650" cy="460" r="16" stroke="#c4c4c4" stroke-width="2"/>
  <path d="M625 460 H675 M650 435 V485" stroke="#c4c4c4" stroke-width="1.5"/>

  <!-- 5-DoF Robotic Arm -->
  <path d="M280 280 L220 230 L160 250 L110 200" stroke="#00e5ff" stroke-width="3" fill="none"/>
  <circle cx="280" cy="280" r="6" stroke="#00e5ff" stroke-width="2" fill="#00e5ff"/>
  <circle cx="220" cy="230" r="5" stroke="#00e5ff" stroke-width="2" fill="#090909"/>
  <circle cx="160" cy="250" r="5" stroke="#00e5ff" stroke-width="2" fill="#090909"/>
  <circle cx="110" cy="200" r="6" stroke="#00e5ff" stroke-width="2" fill="#00e5ff"/>
  <!-- Gripper End-Effector -->
  <path d="M100 190 L90 185 M100 210 L90 215" stroke="#00e5ff" stroke-width="2.5"/>

  <!-- Callout Lines & Data Labels -->
  <path d="M540 155 H630 L650 175" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="660" y="180" fill="#c4c4c4" font-family="monospace" font-size="12" letter-spacing="1.5">HIGH-GAIN S-BAND [IRC-NAV]</text>

  <path d="M110 200 H40" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="40" y="190" fill="#00e5ff" font-family="monospace" font-size="12" letter-spacing="1.5">5-DoF MANIPULATOR ARM</text>

  <path d="M340 140 H220" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="140" y="135" fill="#c4c4c4" font-family="monospace" font-size="12" letter-spacing="1.5">STEREO STERILIZED OPTICS</text>

  <path d="M400 460 V530 H470" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="480" y="534" fill="#c4c4c4" font-family="monospace" font-size="12" letter-spacing="1.5">ROCKER-BOGIE MOBILITY</text>
</svg>
