<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" fill="none" stroke="currentColor">
  <!-- Grid Matrix -->
  <defs>
    <pattern id="avgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="lidarScan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#1f3fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="url(#avgrid)" />

  <!-- LiDAR 360 Scan Cone -->
  <path d="M400 170 L250 80 A300 300 0 0 1 550 80 Z" fill="url(#lidarScan)" stroke="#00e5ff" stroke-width="1.5" stroke-dasharray="4,4"/>

  <!-- Vehicle Silhouette / Wireframe -->
  <path d="M180 380 L220 310 L280 290 L360 210 L510 210 L600 290 L670 320 L690 380 L680 410 H180 Z" 
        stroke="#c4c4c4" stroke-width="2.5" fill="rgba(255, 255, 255, 0.02)"/>
  
  <!-- Cabin Windows & Pillar Architecture -->
  <path d="M370 220 H500 L580 290 H290 Z" stroke="#808080" stroke-width="1.8"/>
  <line x1="450" y1="220" x2="450" y2="290" stroke="#808080" stroke-width="1.5"/>

  <!-- Wheel Arches & Wheels -->
  <circle cx="270" cy="410" r="48" stroke="#c4c4c4" stroke-width="3" fill="#090909"/>
  <circle cx="270" cy="410" r="26" stroke="#c4c4c4" stroke-width="2"/>
  <circle cx="270" cy="410" r="10" fill="#00e5ff"/>
  <path d="M235 410 H305 M270 375 V445" stroke="#808080" stroke-width="1.5"/>

  <circle cx="590" cy="410" r="48" stroke="#c4c4c4" stroke-width="3" fill="#090909"/>
  <circle cx="590" cy="410" r="26" stroke="#c4c4c4" stroke-width="2"/>
  <circle cx="590" cy="410" r="10" fill="#00e5ff"/>
  <path d="M555 410 H625 M590 375 V445" stroke="#808080" stroke-width="1.5"/>

  <!-- Roof-Mounted Sensor Rig (LiDAR + Dual Stereo Cameras) -->
  <rect x="420" y="180" width="60" height="25" rx="3" stroke="#c4c4c4" stroke-width="2" fill="#141414"/>
  <rect x="435" y="160" width="30" height="20" rx="4" stroke="#00e5ff" stroke-width="2.5" fill="#090909"/>
  <line x1="450" y1="160" x2="450" y2="145" stroke="#00e5ff" stroke-width="2"/>
  <circle cx="450" cy="140" r="6" stroke="#00e5ff" stroke-width="2" fill="#00e5ff"/>

  <!-- Front Bumper Ultrasonic & Radar Pod -->
  <path d="M685 365 H715 V385 H685" stroke="#f5a623" stroke-width="2"/>
  <path d="M720 375 Q750 360 760 340 M720 375 Q750 375 770 375 M720 375 Q750 390 760 410" 
        stroke="#f5a623" stroke-width="1.5" stroke-dasharray="3,3"/>

  <!-- Drive-by-Wire Steering & CAN Bus Trajectory Traces -->
  <path d="M140 450 H730" stroke="#262626" stroke-width="2"/>
  <path d="M270 410 C340 460 520 460 590 410" stroke="#1f3fff" stroke-width="2" stroke-dasharray="6,4"/>

  <!-- Callouts & Technical Metadata -->
  <path d="M465 170 H570 L590 145" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="600" y="148" fill="#00e5ff" font-family="monospace" font-size="12" letter-spacing="1.5">360° SOLID-STATE LIDAR [ROS2]</text>

  <path d="M720 375 H780" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="690" y="440" fill="#f5a623" font-family="monospace" font-size="12" letter-spacing="1.5">RADAR / PERCEPTION</text>

  <path d="M270 458 V510 H200" stroke="#808080" stroke-width="1" stroke-dasharray="3,3"/>
  <text x="70" y="514" fill="#c4c4c4" font-family="monospace" font-size="12" letter-spacing="1.5">DRIVE-BY-WIRE ACTUATION</text>
</svg>
